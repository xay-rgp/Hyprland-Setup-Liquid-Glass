# macOS 27 (Golden Gate) Liquid Glass Lock Screen for Hyprlock

$font = Adwaita Sans

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = liquidEase, 0.22, 1.0, 0.36, 1.0
    animation = fadeIn, 1, 4, liquidEase
    animation = fadeOut, 1, 3, liquidEase
    animation = inputFieldDots, 1, 2, liquidEase
    animation = inputFieldColors, 1, 3, liquidEase
    animation = inputFieldWidth, 1, 3, liquidEase
}

# Frosted Liquid Glass wallpaper backdrop (matches hyprland.lua Kawase blur & vibrancy)
background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    color = rgba(16, 18, 26, 1.0)
    blur_passes = 4
    blur_size = 8
    noise = 0.012
    contrast = 1.06
    brightness = 0.90
    vibrancy = 0.40
    vibrancy_darkness = 0.15
}

# Top-right keyboard layout indicator (macOS lock screen status bar style)
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.82)
    font_size = 12
    font_family = $font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = -22, -16
    halign = right
    valign = top
}

# Date (top-center, directly above the clock)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.88)
    font_size = 24
    font_family = $font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, -76
    halign = center
    valign = top
}

# Large translucent Liquid Glass clock (bold macOS lock screen typography)
label {
    monitor =
    text = <b>$TIME</b>
    color = rgba(255, 255, 255, 0.84)
    font_size = 118
    font_family = $font
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.40)
    shadow_boost = 0.7
    position = 0, -104
    halign = center
    valign = top
}

# Username (bottom-center)
label {
    monitor =
    text = <b>$USER</b>
    color = rgba(255, 255, 255, 0.96)
    font_size = 15
    font_family = $font
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, 140
    halign = center
    valign = bottom
}

# Compact translucent Liquid Glass password pill
input-field {
    monitor =
    size = 220, 36
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.58) rgba(255, 255, 255, 0.24) 90deg
    inner_color = rgba(24, 26, 36, 0.28)
    font_color = rgba(255, 255, 255, 0.96)
    check_color = rgba(10, 132, 255, 0.95) rgba(100, 210, 255, 0.90) 45deg
    fail_color = rgba(255, 69, 58, 0.95) rgba(255, 105, 97, 0.88) 45deg
    capslock_color = rgba(255, 159, 10, 0.95)
    bothlock_color = rgba(255, 159, 10, 0.95)
    rounding = -1
    font_family = $font
    placeholder_text = <span foreground="##ffffffb3">Enter Password</span>
    fail_text = <span foreground="##ff6961">$FAIL</span>
    fade_on_empty = false
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.42)
    shadow_boost = 0.7
    position = 0, 96
    halign = center
    valign = bottom
}

# Subtle macOS-style helper caption
label {
    monitor =
    text = Press Enter to unlock
    color = rgba(255, 255, 255, 0.72)
    font_size = 11
    font_family = $font
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, 72
    halign = center
    valign = bottom
}
